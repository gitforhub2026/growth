name: Apply Light Mobile UI Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-light-mobile-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish typography and mobile episode navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/light/index.html')
          s=p.read_text(encoding='utf-8')

          reps = {
          ".section-head{margin:44px 0 18px}.section-head h2{font-family:\"Noto Serif TC\",\"PMingLiU\",serif;font-size:30px;margin:0;letter-spacing:.03em}.section-head p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.7}": ".section-head{margin:44px 0 18px}.section-head h2{font-family:\"Noto Serif TC\",\"PMingLiU\",serif;font-size:32px;margin:0;letter-spacing:.03em}.section-head p{margin:8px 0 0;color:var(--muted);font-size:16px;line-height:1.75}",
          ".ep-kicker{font-size:10px;color:#8a918b;font-weight:900;letter-spacing:.13em}.ep-title{font-size:14px;font-weight:850;line-height:1.45;margin-top:4px}": ".ep-kicker{font-size:11px;color:#8a918b;font-weight:900;letter-spacing:.13em}.ep-title{font-size:15.5px;font-weight:850;line-height:1.5;margin-top:4px}",
          ".topic-label{font-size:10px;color:#7c877e;font-weight:900;letter-spacing:.16em}": ".topic-label{font-size:11px;color:#7c877e;font-weight:900;letter-spacing:.16em}",
          ".subtitle{font-size:17px;color:#667067;line-height:1.72}": ".subtitle{font-size:19px;color:#667067;line-height:1.78}",
          ".tag{font-size:12px;padding:7px 11px": ".tag{font-size:13.5px;padding:8px 12px",
          ".time{font-size:12px;color:#7e857f": ".time{font-size:14px;color:#7e857f",
          ".panel.soft{background:linear-gradient(135deg,#f9efdb,#fbf6eb);font-family:\"Noto Serif TC\",\"PMingLiU\",serif;font-size:20px;line-height:1.7": ".panel.soft{background:linear-gradient(135deg,#f9efdb,#fbf6eb);font-family:\"Noto Serif TC\",\"PMingLiU\",serif;font-size:22px;line-height:1.75",
          ".panel h4{margin:0 0 10px;font-size:17px}.panel p{margin:0;color:#626b64;font-size:14px;line-height:1.85}": ".panel h4{margin:0 0 12px;font-size:19px}.panel p{margin:0;color:#555f58;font-size:17px;line-height:1.9}",
          ".takeaways li{position:relative;padding-left:23px;color:#58625b;font-size:14px;line-height:1.78}": ".takeaways li{position:relative;padding-left:25px;color:#535f57;font-size:17px;line-height:1.85}",
          ".micro h5{margin:0 0 9px;font-size:15px}.micro p{margin:0;color:#616a63;font-size:13px;line-height:1.72}": ".micro h5{margin:0 0 10px;font-size:17px}.micro p{margin:0;color:#59635c;font-size:16px;line-height:1.82}",
          "<span class=\"support-mobile\">吳尊賢基金會</span>": "<span class=\"support-mobile\">公益支持｜吳尊賢基金會</span>",
          "<div class=\"content\"><aside class=\"episode-list\" id=\"episodeList\"></aside><article": "<div class=\"content\"><button class=\"mobile-picker\" id=\"mobilePicker\" type=\"button\" aria-expanded=\"false\"><span><b>選擇其他集數</b><small>找到此刻想聽的一集</small></span><span class=\"picker-arrow\">⌄</span></button><aside class=\"episode-list\" id=\"episodeList\"></aside><article",
          "<div class=\"microgrid\"><section class=\"micro\"><h5>💬 想一想</h5><p id=\"dThink\"></p></section><section class=\"micro\"><h5>🌱 今天的小行動</h5><p id=\"dAction\"></p></section><section class=\"micro\"><h5>♡ 留給自己的一句話</h5><p id=\"dLine\"></p></section></div></article>": "<div class=\"microgrid\"><section class=\"micro\"><h5>💬 想一想</h5><p id=\"dThink\"></p></section><section class=\"micro\"><h5>🌱 今天的小行動</h5><p id=\"dAction\"></p></section><section class=\"micro\"><h5>♡ 留給自己的一句話</h5><p id=\"dLine\"></p></section></div><div class=\"mobile-bottom-nav\"><div class=\"continue-label\">繼續聽</div><div class=\"bottom-nav-row\"><button class=\"navbtn\" id=\"prevBtnBottom\">← 上一集</button><button class=\"navbtn\" id=\"nextBtnBottom\">下一集 →</button></div><button class=\"all-episodes-btn\" id=\"mobileBottomPicker\" type=\"button\">查看全部集數</button></div></article>",
          "const list=document.getElementById('episodeList'),audio=document.getElementById('audio'),playBtn=document.getElementById('playBtn'),coverBtn=document.getElementById('coverBtn'),seek=document.getElementById('seek'),speedBtn=document.getElementById('speedBtn'),audioStatus=document.getElementById('audioStatus');": "const list=document.getElementById('episodeList'),audio=document.getElementById('audio'),playBtn=document.getElementById('playBtn'),coverBtn=document.getElementById('coverBtn'),seek=document.getElementById('seek'),speedBtn=document.getElementById('speedBtn'),audioStatus=document.getElementById('audioStatus'),mobilePicker=document.getElementById('mobilePicker'),mobileBottomPicker=document.getElementById('mobileBottomPicker'),prevBtnBottom=document.getElementById('prevBtnBottom'),nextBtnBottom=document.getElementById('nextBtnBottom');",
          "document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===topics.length-1;": "document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===topics.length-1;prevBtnBottom.disabled=i===0;nextBtnBottom.disabled=i===topics.length-1;",
          "renderList();if(scroll&&window.innerWidth<981)document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}": "renderList();if(window.innerWidth<=680){list.classList.remove('mobile-open');mobilePicker.classList.remove('open');mobilePicker.setAttribute('aria-expanded','false')}if(scroll&&window.innerWidth<981)document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}",
          "document.getElementById('prevBtn').onclick=()=>current>0&&selectTopic(current-1,true);document.getElementById('nextBtn').onclick=()=>current<topics.length-1&&selectTopic(current+1,true);selectTopic(0);": "document.getElementById('prevBtn').onclick=()=>current>0&&selectTopic(current-1,true);document.getElementById('nextBtn').onclick=()=>current<topics.length-1&&selectTopic(current+1,true);prevBtnBottom.onclick=()=>current>0&&selectTopic(current-1,true);nextBtnBottom.onclick=()=>current<topics.length-1&&selectTopic(current+1,true);function toggleMobileEpisodes(){const open=list.classList.toggle('mobile-open');mobilePicker.classList.toggle('open',open);mobilePicker.setAttribute('aria-expanded',String(open))}mobilePicker.onclick=toggleMobileEpisodes;mobileBottomPicker.onclick=()=>{list.classList.add('mobile-open');mobilePicker.classList.add('open');mobilePicker.setAttribute('aria-expanded','true');mobilePicker.scrollIntoView({behavior:'smooth',block:'center'})};selectTopic(0);"
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit('Missing expected text: '+old[:120])
              s=s.replace(old,new,1)

          css_insert = """
.mobile-picker,.mobile-bottom-nav{display:none}
"""
          s=s.replace('@media(max-width:980px){',css_insert+'@media(max-width:980px){',1)

          mobile_old='@media(max-width:680px){html{scroll-padding-top:70px}body{padding-top:58px}.shell{width:min(100% - 22px,1380px)}.topbar{height:58px;gap:8px}.brand{gap:7px;min-width:0}.brand-text{font-size:17px;letter-spacing:.02em;white-space:nowrap}.brand-text small{display:none}.sprout{font-size:19px}.support-desktop{display:none}.support-mobile{display:inline}.support{font-size:11px;letter-spacing:0;text-align:right;line-height:1;white-space:nowrap;max-width:none;color:var(--green);font-weight:900}'
          mobile_new='@media(max-width:680px){html{scroll-padding-top:70px}body{padding-top:58px}.shell{width:min(100% - 22px,1380px)}.topbar{height:58px;gap:8px}.brand{gap:7px;min-width:0}.brand-text{font-size:17px;letter-spacing:.02em;white-space:nowrap}.brand-text small{display:none}.sprout{font-size:19px}.support-desktop{display:none}.support-mobile{display:inline}.support{font-size:12px;letter-spacing:0;text-align:right;line-height:1.2;white-space:nowrap;max-width:none;color:var(--green);font-weight:900}'
          if mobile_old not in s: raise SystemExit('mobile header block missing')
          s=s.replace(mobile_old,mobile_new,1)

          mobile_reps={
          '.hero .sub{font-size:12.5px;line-height:1.7;margin-top:10px;max-width:270px}':'.hero .sub{font-size:14px;line-height:1.75;margin-top:10px;max-width:300px}',
          '.section-head p{font-size:13px;line-height:1.65;max-width:92%}':'.section-head p{font-size:15px;line-height:1.72;max-width:96%}',
          '.content{gap:15px;padding-bottom:44px}.episode-list{display:block;padding:9px;border-radius:20px;background:rgba(255,255,255,.72)}':'.content{gap:14px;padding-bottom:44px}.mobile-picker{display:flex;width:100%;border:1px solid #dfded7;background:#fffdf9;border-radius:18px;padding:14px 16px;align-items:center;justify-content:space-between;text-align:left;color:var(--ink);box-shadow:0 8px 24px rgba(55,63,52,.05);cursor:pointer}.mobile-picker b{display:block;font-size:16px}.mobile-picker small{display:block;margin-top:3px;color:#7a837c;font-size:13px}.picker-arrow{font-size:22px;color:var(--green);transition:.2s}.mobile-picker.open .picker-arrow{transform:rotate(180deg)}.episode-list{display:none;padding:9px;border-radius:20px;background:rgba(255,255,255,.72)}.episode-list.mobile-open{display:block}',
          '.ep-kicker{font-size:9px;letter-spacing:.11em}.ep-title{font-size:13.5px;line-height:1.4}':'.ep-kicker{font-size:11px;letter-spacing:.1em}.ep-title{font-size:15.5px;line-height:1.48}',
          '.navbtn{flex:1;padding:8px 9px;font-size:11px}':'.navbtn{flex:1;padding:11px 10px;font-size:14px;font-weight:750}',
          '.topic-label{font-size:9px;letter-spacing:.13em}':'.topic-label{font-size:11px;letter-spacing:.12em}',
          '.subtitle{font-size:14px;line-height:1.65}':'.subtitle{font-size:16px;line-height:1.75}',
          '.tag{font-size:10.5px;padding:6px 9px}':'.tag{font-size:12.5px;padding:7px 10px}',
          '.panel.soft{font-size:17px}.panel h4{font-size:15px}.panel p,.takeaways li{font-size:13px}.micro{padding:16px;min-height:0}':'.panel.soft{font-size:19px}.panel h4{font-size:17px}.panel p,.takeaways li{font-size:16px;line-height:1.82}.micro{padding:17px;min-height:0}.micro h5{font-size:16px}.micro p{font-size:16px;line-height:1.8}.time{font-size:13px}',
          '.footer{padding:20px 0 34px;line-height:1.65}':'.mobile-bottom-nav{display:block;margin-top:20px;padding:18px 4px 2px;border-top:1px solid #e8e2d8}.continue-label{font-family:\"Noto Serif TC\",\"PMingLiU\",serif;font-size:18px;font-weight:800;margin-bottom:10px}.bottom-nav-row{display:flex;gap:9px}.all-episodes-btn{width:100%;margin-top:9px;border:1px solid #d9dfd8;background:#edf3ea;color:var(--green);border-radius:14px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}.footer{padding:22px 0 36px;line-height:1.7;font-size:13.5px}'
          }
          for old,new in mobile_reps.items():
              if old not in s: raise SystemExit('Missing mobile text: '+old[:100])
              s=s.replace(old,new,1)

          # Avoid shrinking the most important mobile copy on very narrow phones.
          s=s.replace('@media(max-width:350px){.brand-text{font-size:16px}.support{font-size:10px}.hero p{font-size:14.5px}}','@media(max-width:350px){.brand-text{font-size:15.5px}.support{font-size:11px}.hero p{font-size:14.5px}}',1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "gitforhub2026"
          git config user.email "actions@users.noreply.github.com"
          git add public/light/index.html
          git commit -m "Improve Light typography and mobile episode navigation"
          git push
