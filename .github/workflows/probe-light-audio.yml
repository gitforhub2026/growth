name: Probe Light Audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-light-audio.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe new R2 files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse, urllib.request, urllib.error
          groups={
            '13':['13','13原諒是為了放過自己','13 原諒是為了放過自己','13原諒是為了放過自己 (1)','13 原諒是為了放過自己 (1)'],
            '14':['14','14劃清家庭情緒界線','14 劃清家庭情緒界線','14劃清家庭情緒界線 (1)','14 劃清家庭情緒界線 (1)'],
            '15':['15','15突發焦慮接地法','15 突發焦慮接地法','15突發焦慮接地法 (1)','15 突發焦慮接地法 (1)']
          }
          exts=['.m4a','.mp3','.wav','.aac']
          base='https://growth.notesss.workers.dev/light-audio/'
          found={}
          for num,names in groups.items():
              for stem in names:
                  for ext in exts:
                      key=stem+ext
                      req=urllib.request.Request(base+urllib.parse.quote(key,safe=''),headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-31'},method='GET')
                      try:
                          with urllib.request.urlopen(req,timeout=10) as r:
                              if r.status in (200,206) and r.read(1):
                                  found[num]=key
                                  print('FOUND',num,repr(key),r.status,r.headers.get('content-type'))
                                  break
                      except urllib.error.HTTPError as e:
                          if e.code not in (403,404): print('HTTP',key,e.code)
                      except Exception as e:
                          print('ERR',key,type(e).__name__,e)
                  if num in found: break
          print('RESULT',found)
          missing=[n for n in groups if n not in found]
          if missing: raise SystemExit('Missing '+','.join(missing))
          PY
