name: E2E Light

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/ux-fixes.js'
      - 'public/ux-fixes.css'
      - 'public/light/**'
      - 'public/light-feedback.*'
      - 'public/light-ux.*'
      - 'src/**'
      - 'wrangler.jsonc'
      - '.github/workflows/e2e-light.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Git deployment
        run: sleep 75
      - name: Verify homepage remains intact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/?e2e=${GITHUB_SHA}" -o /tmp/root.html
          grep -q '傳愛成長工具箱' /tmp/root.html
          ! grep -q '<title>傳愛光明棧｜Podcast</title>' /tmp/root.html
          grep -Fq '<div class="support-credit support-uniform">感謝公益支持│吳尊賢文教公益基金會</div>' /tmp/root.html
          grep -Fq '.support-uniform{font-size:13px!important;font-weight:750!important;color:#667268!important;' /tmp/root.html
          ! grep -Fq '<div class="support-credit"><span>公益支持</span><strong>吳尊賢文教公益基金會</strong></div>' /tmp/root.html
          grep -Fq 'href="/ux-fixes.css"' /tmp/root.html
          grep -Fq '<script src="/ux-fixes.js"></script>' /tmp/root.html
          grep -Fq 'rel="icon" href="data:,"' /tmp/root.html
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/ux-fixes.js?e2e=${GITHUB_SHA}" -o /tmp/ux-fixes.js
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/ux-fixes.css?e2e=${GITHUB_SHA}" -o /tmp/ux-fixes.css
          node --check /tmp/ux-fixes.js
          grep -Fq 'selectEpisode(button.dataset.play, true, false)' /tmp/ux-fixes.js
          grep -Fq 'window.scrollTo({ top: readingPosition' /tmp/ux-fixes.js
          grep -Fq "className = 'mobile-now-player'" /tmp/ux-fixes.js
          grep -Fq "new MutationObserver(() => syncCardButtons())" /tmp/ux-fixes.js
          grep -Fq "formFocused = true" /tmp/ux-fixes.js
          grep -Fq '播放失敗，請再試一次' /tmp/ux-fixes.js
          grep -Fq '.mobile-now-player{' /tmp/ux-fixes.css
          grep -Fq '.mobile-now-player.is-visible{' /tmp/ux-fixes.css
          grep -Fq 'prefers-reduced-motion:reduce' /tmp/ux-fixes.css
      - name: Verify Growth mobile UX in browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          npm install --no-save --ignore-scripts playwright-core@1.56.1 >/dev/null 2>&1
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required']
            });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto(`https://growth.notesss.workers.dev/?ux=${Date.now()}`, { waitUntil: 'domcontentloaded' });
            const card = page.locator('#episode-grid .play-btn[data-play]').first();
            await card.waitFor({ state: 'visible' });
            await card.scrollIntoViewIfNeeded();
            await page.waitForTimeout(400);

            const before = await page.evaluate(() => window.scrollY);
            await card.click();
            await page.waitForTimeout(900);
            const after = await page.evaluate(() => window.scrollY);
            if (Math.abs(after - before) > 12) throw new Error(`Playback moved viewport: ${before} -> ${after}`);

            const miniVisible = await page.locator('.mobile-now-player').evaluate((el) =>
              el.classList.contains('is-visible') && getComputedStyle(el).visibility === 'visible'
            );
            if (!miniVisible) throw new Error('Mobile player bar did not become visible');

            const playingText = await card.innerText();
            if (!playingText.includes('暫停')) throw new Error(`Card did not switch to pause: ${playingText}`);

            await card.click();
            await page.waitForTimeout(250);
            if (!(await page.locator('#audio-player').evaluate((el) => el.paused))) throw new Error('Second tap did not pause audio');
            if (!(await card.innerText()).includes('繼續播放')) throw new Error('Card did not show resume state');

            await page.locator('.mobile-now-toggle').click();
            await page.waitForFunction(() => !document.querySelector('#audio-player')?.paused, null, { timeout: 5000 });
            if (!(await page.locator('.mobile-now-toggle').innerText()).includes('❚❚')) throw new Error('Mini player did not resume');

            const filters = page.locator('#filters button');
            if (await filters.count() > 1) {
              await filters.nth(1).click();
              await page.waitForTimeout(150);
              await filters.first().click();
              await page.waitForTimeout(150);
              const activeText = await page.locator('#episode-grid .active-card .play-btn').first().innerText();
              if (!activeText.includes('暫停')) throw new Error(`Filter rerender lost playback state: ${activeText}`);
            }

            const textarea = page.locator('#feedback-form textarea');
            await textarea.scrollIntoViewIfNeeded();
            await page.waitForTimeout(250);
            if (!(await page.locator('.mobile-now-player').evaluate(el => el.classList.contains('is-visible')))) throw new Error('Mini player should be visible before typing');
            await textarea.focus();
            await page.waitForTimeout(150);
            if (await page.locator('.mobile-now-player').evaluate(el => el.classList.contains('is-visible'))) throw new Error('Mini player did not make room for form input');
            await textarea.blur();
            await page.waitForTimeout(150);
            if (!(await page.locator('.mobile-now-player').evaluate(el => el.classList.contains('is-visible')))) throw new Error('Mini player did not return after typing');

            await browser.close();
            console.log('Growth mobile UX OK');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Verify light page structure and user copy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/light/?e2e=${GITHUB_SHA}" -o /tmp/light.html
          for text in '<title>傳愛光明棧｜Podcast</title>' '感謝公益支持│吳尊賢文教公益基金會' '選一集，慢慢聽' 'PODCAST' '有些事情，為什麼一直放不下？' '原諒，真的是唯一的出口嗎？' '面對原生家庭，如何不斷聯也不委屈？' '突然焦慮卡住時，如何把自己接回當下？' "file:'13.m4a'" "file:'14.m4a'" "file:'15.m4a'"; do
            grep -Fq "$text" /tmp/light.html || { echo "Missing: $text"; exit 1; }
          done
          for old in '聲音內容' '聲音主題' '音檔已連接，可直接播放' '這個主題的文字內容已整理，音檔尚未放入 R2。' '目前已上架' '搜尋集數或主題' '>節目介紹<'; do
            ! grep -Fq "$old" /tmp/light.html || { echo "Old/internal copy remains: $old"; exit 1; }
          done
          grep -Fq '<div class="support support-uniform">感謝公益支持│吳尊賢文教公益基金會</div>' /tmp/light.html
          grep -Fq 'id="light-feedback-form"' /tmp/light.html
          grep -Fq '歡迎留下建議' /tmp/light.html
          grep -Fq 'href="/light-feedback.css"' /tmp/light.html
          grep -Fq 'href="/light-ux.css"' /tmp/light.html
          grep -Fq '<script src="/light-feedback.js"></script><script src="/light-ux.js"></script>' /tmp/light.html
          grep -Fq 'rel="icon" href="data:,"' /tmp/light.html
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/light-feedback.css?e2e=${GITHUB_SHA}" -o /tmp/light-feedback.css
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/light-feedback.js?e2e=${GITHUB_SHA}" -o /tmp/light-feedback.js
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/light-ux.css?e2e=${GITHUB_SHA}" -o /tmp/light-ux.css
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/light-ux.js?e2e=${GITHUB_SHA}" -o /tmp/light-ux.js
          node --check /tmp/light-feedback.js
          node --check /tmp/light-ux.js
          grep -Fq '.light-feedback{' /tmp/light-feedback.css
          grep -Fq "source: 'light-house'" /tmp/light-feedback.js
          grep -Fq '.light-now-player{' /tmp/light-ux.css
          grep -Fq "row.setAttribute('role', 'button')" /tmp/light-ux.js
          grep -Fq '播放失敗，請再試一次' /tmp/light-ux.js
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors "https://growth.notesss.workers.dev/light/assets/hero.webp?e2e=${GITHUB_SHA}" -o /tmp/hero.webp
          test -s /tmp/hero.webp
          file /tmp/hero.webp | grep -qi 'Web/P image\|WebP'
      - name: Verify Light mobile reader UX in browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          CHROME_BIN="$CHROME_BIN" node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: ['--no-sandbox', '--autoplay-policy=no-user-gesture-required']
            });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto(`https://growth.notesss.workers.dev/light/?ux=${Date.now()}`, { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(500);

            const picker = page.locator('#mobilePicker');
            await picker.click();
            const rows = page.locator('#episodeList .ep-row');
            const second = rows.nth(1);
            await second.focus();
            if ((await second.getAttribute('role')) !== 'button' || (await second.getAttribute('tabindex')) !== '0') throw new Error('Episode row is not keyboard accessible');
            const beforeTitle = await page.locator('#dTitle').innerText();
            await page.keyboard.press('Enter');
            await page.waitForTimeout(300);
            const afterTitle = await page.locator('#dTitle').innerText();
            if (beforeTitle === afterTitle) throw new Error('Keyboard episode selection did not work');

            await picker.click();
            const playMini = page.locator('#episodeList .playmini').first();
            const box = await playMini.boundingBox();
            if (!box || box.width < 44 || box.height < 44) throw new Error(`Small touch target: ${JSON.stringify(box)}`);
            await playMini.click();
            await page.waitForFunction(() => !document.querySelector('#audio')?.paused, null, { timeout: 5000 });

            const bottom = page.locator('#mobileBottomPicker');
            await bottom.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            const miniVisible = await page.locator('.light-now-player').evaluate(el => el.classList.contains('is-visible') && getComputedStyle(el).visibility === 'visible');
            if (!miniVisible) throw new Error('Persistent Light player did not follow reader');

            await page.locator('.light-now-toggle').click();
            await page.waitForTimeout(150);
            if (!(await page.locator('#audio').evaluate(el => el.paused))) throw new Error('Persistent Light player did not pause');
            await page.locator('.light-now-toggle').click();
            await page.waitForFunction(() => !document.querySelector('#audio')?.paused, null, { timeout: 5000 });

            const textarea = page.locator('#light-feedback-form textarea');
            await textarea.scrollIntoViewIfNeeded();
            await page.waitForTimeout(200);
            await textarea.focus();
            await page.waitForTimeout(120);
            if (await page.locator('.light-now-player').evaluate(el => el.classList.contains('is-visible'))) throw new Error('Light mini player did not make room for form input');

            const seekBox = await page.locator('#seek').boundingBox();
            if (!seekBox || seekBox.height < 32) throw new Error(`Seek touch target too small: ${JSON.stringify(seekBox)}`);

            await browser.close();
            console.log('Light mobile reader UX OK');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Verify all R2 audio objects are streamable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse, urllib.request
          keys = [
            '01 (1).m4a','02 (1).m4a','03修復不等於和好.m4a','04 (1).m4a',
            '05撕下社會名牌找回自己.m4a','06 (1).m4a','07靠微勝利走出低潮.m4a',
            '08為什麼改變了還是不被信任.m4a','09別讓過去定義你.m4a','10怎樣道歉才有效.m4a',
            '11靠微小行動走出低潮.m4a','12劃出人生停損點.m4a',
            '13.m4a','14.m4a','15.m4a'
          ]
          base='https://growth.notesss.workers.dev/light-audio/'
          for key in keys:
              url=base+urllib.parse.quote(key, safe='')
              req=urllib.request.Request(url, headers={
                  'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Range':'bytes=0-1023','Accept':'*/*'
              }, method='GET')
              with urllib.request.urlopen(req, timeout=30) as r:
                  assert r.status in (200,206), (key, r.status)
                  ctype=r.headers.get('content-type','')
                  assert ctype.startswith('audio/'), (key, ctype)
                  assert r.read(1024), key
                  print('OK', key, r.status, ctype)
          PY
      - name: Verify route isolation
        shell: bash
        run: |
          set -euo pipefail
          root_hash=$(curl -fsSL "https://growth.notesss.workers.dev/?e2e=${GITHUB_SHA}" | sha256sum | awk '{print $1}')
          light_hash=$(curl -fsSL "https://growth.notesss.workers.dev/light/?e2e=${GITHUB_SHA}" | sha256sum | awk '{print $1}')
          test "$root_hash" != "$light_hash"
          echo "root=$root_hash"
          echo "light=$light_hash"
