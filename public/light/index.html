<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}button{font:inherit}.shell{width:min(1380px,calc(100% - 42px));margin:auto}
.site-header{position:sticky;top:0;z-index:100;background:rgba(247,244,237,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(215,209,199,.82)}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.sprout{font-size:27px}.brand-text{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:800;font-size:25px;letter-spacing:.08em}.brand-text small{display:block;font:700 9px/1.2 Inter,sans-serif;letter-spacing:.28em;color:#858a84;margin-top:4px}.support{font-size:13px;font-weight:700;color:#667268;letter-spacing:.04em;white-space:nowrap}.support b{color:var(--green);font-weight:900}
.hero{position:relative;overflow:hidden;border-radius:30px;min-height:350px;margin-top:24px;background:linear-gradient(100deg,#f8f3e8 0%,#f5efe2 45%,#eaf0e7 100%);box-shadow:var(--shadow)}.hero-grid{display:grid;grid-template-columns:42% 58%;min-height:350px}.hero-copy{padding:46px 44px;position:relative;z-index:2}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--green2)}.hero h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:clamp(44px,5vw,74px);line-height:1.05;margin:15px 0 20px;font-weight:800;letter-spacing:.08em}.hero p{font-size:20px;line-height:1.65;margin:0;color:#4e5d53;max-width:480px}.hero .sub{font-size:14px;color:#7b827a;margin-top:13px}.hero-art{position:relative;min-height:350px}.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f5efe2 0%,rgba(245,239,226,.15) 28%,transparent 60%)}.doodle{position:absolute;right:5%;bottom:9%;z-index:2;background:rgba(255,255,255,.76);backdrop-filter:blur(8px);border-radius:18px;padding:14px 18px;max-width:270px;font-family:"Noto Serif TC","PMingLiU",serif;font-size:17px;line-height:1.6;transform:rotate(-2deg)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:44px 0 18px}.section-head h2{font-size:29px;margin:0}.section-head p{margin:6px 0 0;color:var(--muted);font-size:14px}.live-badge{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:#edf2e9;color:#506452;font-size:12px;font-weight:900}.live-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#6d9a72}
.content{display:grid;grid-template-columns:410px minmax(0,1fr);gap:26px;align-items:start;padding-bottom:70px}.episode-list{background:rgba(255,255,255,.62);border:1px solid rgba(224,217,205,.85);border-radius:26px;padding:14px;position:sticky;top:92px;max-height:calc(100vh - 115px);overflow:auto}.episode-list::-webkit-scrollbar{width:8px}.episode-list::-webkit-scrollbar-thumb{background:#d8d5cc;border-radius:999px}.ep-row{display:grid;grid-template-columns:52px 1fr 38px;gap:12px;align-items:center;padding:11px;border-radius:17px;cursor:pointer;transition:.18s;margin:2px 0}.ep-row:hover{background:#f6f3ed}.ep-row.active{background:#eef2e9;box-shadow:inset 3px 0 0 var(--green)}.thumb{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#dce8d8,#f0d9b3)}.ep-meta{min-width:0}.ep-kicker{font-size:11px;color:#8a918b;font-weight:800;letter-spacing:.04em}.ep-title{font-size:14px;font-weight:850;line-height:1.45;margin-top:3px}.playmini{border:0;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 5px 16px rgba(0,0,0,.08);cursor:pointer;color:var(--green);font-size:14px}.playmini:hover{transform:scale(1.04)}
.detail{background:var(--card);border:1px solid rgba(224,217,205,.8);border-radius:30px;padding:28px;box-shadow:var(--shadow)}.detail-top{display:flex;justify-content:flex-end;gap:8px}.navbtn{border:1px solid #e5e0d7;background:#fff;border-radius:999px;padding:8px 12px;color:#687169;cursor:pointer;font-size:12px}.navbtn:disabled{opacity:.35;cursor:default}.detail-hero{display:grid;grid-template-columns:36% 1fr;gap:28px;align-items:center;margin-top:14px}.cover{aspect-ratio:4/3;border-radius:22px;overflow:hidden;position:relative;display:grid;place-items:center;font-size:70px;background:linear-gradient(135deg,#cee0cb,#f1d4a6)}.cover:after{content:"▶";position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--green);font-size:19px;box-shadow:0 6px 18px rgba(0,0,0,.08)}.topic-label{font-size:11px;color:#7c877e;font-weight:900;letter-spacing:.12em}.detail h3{font-family:"Noto Serif TC","PMingLiU",serif;font-size:clamp(31px,3vw,48px);line-height:1.27;margin:8px 0 12px;letter-spacing:.02em}.subtitle{font-size:17px;color:#667067;line-height:1.72}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.tag{font-size:12px;padding:7px 11px;border-radius:999px;background:#eef2ea;color:#536452}.tag:nth-child(2){background:#edf0f4;color:#576470}.tag:nth-child(3){background:#f6ead7;color:#7d6034}
.player{display:grid;grid-template-columns:54px 1fr auto;gap:15px;align-items:center;margin:27px 0 24px;background:#f0f1ed;border-radius:21px;padding:12px 16px}.play{border:0;width:50px;height:50px;border-radius:50%;background:var(--green);color:white;font-size:18px;cursor:pointer}.progress-wrap{display:grid;gap:7px}.seek{width:100%;accent-color:var(--green);cursor:pointer}.time{font-size:12px;color:#7e857f;font-variant-numeric:tabular-nums}.speed{border:1px solid #d8dbd6;background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer}.status{font-size:12px;color:#8a918b;margin-top:-13px;margin-bottom:18px}.status.error{color:#9b584c}
.quick{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}.panel{border:1px solid #ece7de;border-radius:20px;padding:21px;background:#fff}.panel.soft{background:linear-gradient(135deg,#f9efdb,#fbf6eb);font-family:"Noto Serif TC","PMingLiU",serif;font-size:20px;line-height:1.7;display:flex;align-items:center}.panel h4{margin:0 0 10px;font-size:17px}.panel p{margin:0;color:#626b64;font-size:14px;line-height:1.85}.microgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.micro{border-radius:18px;padding:18px;min-height:130px}.micro h5{margin:0 0 9px;font-size:15px}.micro p{margin:0;color:#616a63;font-size:13px;line-height:1.72}.micro:nth-child(1){background:var(--blue)}.micro:nth-child(2){background:var(--sage)}.micro:nth-child(3){background:var(--rose)}.footer{padding:24px 0 44px;text-align:center;color:#858c85;font-size:12px}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}.hero-copy{padding:38px 32px}.hero-art{min-height:290px}.content{grid-template-columns:1fr}.episode-list{position:static;max-height:none;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.detail-hero{grid-template-columns:1fr 1.25fr}.quick{grid-template-columns:1fr}.microgrid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:680px){.shell{width:min(100% - 24px,1380px)}.topbar{height:64px;gap:12px}.brand-text{font-size:20px}.brand-text small{font-size:8px}.sprout{font-size:23px}.support{font-size:10px;letter-spacing:0;text-align:right;line-height:1.45;white-space:normal;max-width:165px}.hero{border-radius:22px;margin-top:14px}.hero-copy{padding:30px 24px}.hero h1{font-size:44px}.hero p{font-size:17px}.hero-art{min-height:230px}.doodle{font-size:14px;max-width:205px;padding:10px 12px}.section-head{display:block;margin-top:32px}.live-badge{margin-top:12px}.content{gap:18px}.episode-list{display:block}.detail{padding:19px 15px;border-radius:23px}.detail-hero{grid-template-columns:1fr}.detail h3{font-size:34px}.cover{aspect-ratio:16/9}.player{grid-template-columns:50px 1fr}.speed{display:none}.quick,.microgrid{grid-template-columns:1fr}.detail-top{justify-content:space-between}.navbtn{flex:1}.ep-row{grid-template-columns:48px 1fr 36px}.thumb{width:48px;height:48px}}
</style>

<body>
<header class="site-header">
  <div class="shell topbar">
    <a class="brand" href="/light/"><span class="sprout">🌱</span><span class="brand-text">傳愛光明棧<small>PODCAST</small></span></a>
    <div class="support">公益支持│<b>吳尊賢文教公益基金會</b></div>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <div class="hero-grid">
      <div class="hero-copy">
        <div class="eyebrow">LIGHT HOUSE · PODCAST</div>
        <h1>傳愛<br>光明棧</h1>
        <p>在生活的轉彎處，陪你看見一點光。</p>
        <div class="sub">五個面向 · 十五集聲音內容 · 給正在努力生活的你</div>
      </div>
      <div class="hero-art"><img src="assets/hero.webp" alt="陽光下的孩子與花朵"><div class="doodle">一段聲音的陪伴，<br>給正在努力生活的你。</div></div>
    </div>
  </section>

  <section>
    <div class="section-head"><div><h2>聲音內容</h2><p>檔名留在後台，網頁只呈現適合閱讀與分享的主題名稱。</p></div><span class="live-badge">目前已上架 12 個主題</span></div>
    <div class="content">
      <aside class="episode-list" id="episodeList"></aside>
      <article class="detail" id="detail">
        <div class="detail-top"><button class="navbtn" id="prevBtn">← 上一個主題</button><button class="navbtn" id="nextBtn">下一個主題 →</button></div>
        <div class="detail-hero">
          <button class="cover" id="coverBtn" aria-label="播放目前主題"></button>
          <div><div class="topic-label" id="dCat">聲音主題</div><h3 id="dTitle"></h3><div class="subtitle" id="dSubtitle"></div><div class="tags" id="dTags"></div></div>
        </div>
        <audio id="audio" preload="metadata"></audio>
        <div class="player"><button class="play" id="playBtn" aria-label="播放">▶</button><div class="progress-wrap"><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="播放進度"><div class="time"><span id="currentTime">0:00</span> / <span id="duration">--:--</span></div></div><button class="speed" id="speedBtn">1×</button></div>
        <div class="status" id="audioStatus">音檔已連接至 R2 Object Storage</div>
        <div class="quick"><section class="panel"><h4>▤　本集簡介</h4><p id="dIntro"></p></section><aside class="panel soft" id="dQuote"></aside></div>
        <div class="microgrid"><section class="micro"><h5>💬 想一想</h5><p id="dThink"></p></section><section class="micro"><h5>🌱 今天的小行動</h5><p id="dAction"></p></section><section class="micro"><h5>♡ 留給自己的一句話</h5><p id="dLine"></p></section></div>
      </article>
    </div>
  </section>
  <footer class="footer">傳愛光明棧 · 2026　｜　把紙本的陪伴，延伸成可以隨時聽見的聲音。</footer>
</main>
<script>
const topics=[
{file:'01 (1).m4a',cat:'內在安頓',icon:'🧠',title:'放不下，可能只是大腦還沒放手',sub:'當一件事反覆在腦中打轉，先別急著怪自己。',tags:['放下','反覆思考','自我安頓'],intro:'有些事明明已經過了，腦中卻一直重播。這一集從「放不下」的感受出發，陪你看見卡住的地方，練習把注意力一點一點帶回現在。',quote:'不是逼自己忘掉，而是慢慢把生活拿回來。',think:'最近有哪一件事，你其實不是想回去，只是還沒有真正告別？',action:'把腦中反覆出現的那句話寫下來，再補一句：「現在的我可以先做＿＿。」',line:'放下不是刪除過去，而是不再讓過去決定今天。',grad:'linear-gradient(135deg,#d9e8de,#ecd9ba)'},
{file:'02 (1).m4a',cat:'關係修復',icon:'🤝',title:'關係不必回到「和好如初」',sub:'修復，不一定是回到原點，也可以重新選擇距離。',tags:['關係修復','界線','重新連結'],intro:'有些關係經歷裂痕後，很難再回到原來的樣子。這一集想談的不是勉強恢復，而是重新理解彼此、重新決定距離，找到更適合現在的相處方式。',quote:'修復的終點，不一定是回到從前。',think:'如果不用回到原本的關係，你希望新的距離是什麼樣子？',action:'寫下你希望保留的一件事，以及不想再重複的一件事。',line:'關係可以改變形狀，仍然保有尊重。',grad:'linear-gradient(135deg,#dfe9ee,#eadfd2)'},
{file:'03修復不等於和好.m4a',cat:'關係修復',icon:'🧩',title:'修復，不等於一定要和好',sub:'有些修復，是把自己從傷裡帶出來。',tags:['修復','界線','自我照顧'],intro:'修復可以是對話，也可以是理解、放下期待，甚至只是讓自己不再被同一件事反覆拉回去。和好只是其中一種可能，不是唯一答案。',quote:'有時候，修復的是自己，不是關係。',think:'你真正需要的是對方回來，還是自己能夠往前？',action:'寫下一個你能為自己完成、而不需要對方配合的修復行動。',line:'不再受傷，也是一種修復。',grad:'linear-gradient(135deg,#e6ded8,#dce8df)'},
{file:'04 (1).m4a',cat:'身心陪伴',icon:'🌙',title:'孤單，不等於獨處',sub:'一個人和覺得沒有人懂，是兩種不同的感受。',tags:['孤獨感','陪伴','心理健康'],intro:'有時身邊很多人，心裡還是很孤單；有時一個人待著，反而很安穩。這一集從這個差別出發，重新理解我們真正需要的是什麼。',quote:'真正難受的，往往不是一個人，而是沒有連結。',think:'最近讓你覺得孤單的，是少了人，還是少了被理解的感覺？',action:'主動傳一則訊息給一個你願意真實說話的人，不必聊很多。',line:'獨處可以是空間，孤單才是需要被看見的訊號。',grad:'linear-gradient(135deg,#dce4ed,#e8dfd5)'},
{file:'05撕下社會名牌找回自己.m4a',cat:'自我認同',icon:'🏷️',title:'撕下社會名牌，找回真正的自己',sub:'當職稱、角色與別人的期待拿掉，還剩下什麼？',tags:['自我認同','人生角色','重新認識自己'],intro:'我們很容易用工作、成就、家庭角色來回答「我是誰」。當這些標籤改變，甚至突然消失時，也可能不知道自己還剩下什麼。這一集陪你把視線拉回自己。',quote:'你擁有的角色很多，但沒有一個角色等於全部的你。',think:'如果不能用工作、收入、家庭角色介紹自己，你會怎麼說「我是誰」？',action:'寫下三個不依賴身分與成就、仍然屬於你的特質。',line:'名牌會換，人的價值不必跟著換。',grad:'linear-gradient(135deg,#eee1c9,#dde7dc)'},
{file:'06 (1).m4a',cat:'自我認同',icon:'🪞',title:'別讓負面標籤定義你',sub:'一句評價可以留下很久，但它不必成為你的人生說明。',tags:['負面標籤','自我價值','重新定義'],intro:'「你就是不夠好」「你一直都這樣」——有些話聽久了，會不知不覺變成我們對自己的描述。這一集練習把標籤和真實的自己分開。',quote:'別人的一句話，不必成為你的永久標籤。',think:'有哪一個你常拿來形容自己的負面詞，其實不是完整的事實？',action:'把一個負面標籤改寫成更具體、可改變的描述。',line:'你不是一個標籤，你是一個仍在變化的人。',grad:'linear-gradient(135deg,#e4e8dc,#ead7d2)'},
{file:'07靠微勝利走出低潮.m4a',cat:'低潮復原',icon:'🏁',title:'用「微勝利」一步步走出低潮',sub:'低潮時，不求一次翻盤，先累積一個做得到的小成功。',tags:['低潮','微勝利','心理韌性'],intro:'當狀態很低時，「振作起來」反而像一個太大的要求。這一集把目標縮小，從一個個可完成的小勝利，重新累積行動感。',quote:'先贏一件很小的事，就有可能把今天拉回來一點。',think:'今天什麼事情小到你幾乎不可能失敗？',action:'選一件五分鐘內能完成的事，完成後明確告訴自己：「這一件我做到了。」',line:'低潮不是靠一大步離開，而是很多小步累積。',grad:'linear-gradient(135deg,#dce8d4,#f0e2bf)'},
{file:'08為什麼改變了還是不被信任.m4a',cat:'關係修復',icon:'🌿',title:'明明改變了，為什麼還是不被信任？',sub:'改變需要時間，信任恢復也有自己的速度。',tags:['信任','改變','關係修復'],intro:'你可能真的已經在改，但對方仍然懷疑、觀望，甚至不願相信。這一集把「我已經改了」和「對方重新相信我」分開來看，讓改變有更穩定的落點。',quote:'改變是你的選擇，信任是對方慢慢重新建立的感受。',think:'如果暫時得不到肯定，你還願不願意繼續做現在的改變？',action:'選一個你想持續的行動，不解釋、不證明，先穩定做一週。',line:'真正的改變，不只發生在被看見的時候。',grad:'linear-gradient(135deg,#d8eadc,#e8ddd0)'},
{file:'09別讓過去定義你.m4a',cat:'重新出發',icon:'🌅',title:'別讓過去定義現在的你',sub:'承認發生過，不代表要永遠活在那個版本裡。',tags:['過去','重新出發','自我接納'],intro:'過去的失誤、選擇或經歷確實存在，但它們不必變成對未來的判決。這一集想陪你把「曾經發生」和「我就是這樣」分開。',quote:'過去是資料，不是判決書。',think:'你現在還在替哪一個過去的自己受罰？',action:'寫下一件過去教會你的事，再寫一個今天不同的選擇。',line:'你可以承認過去，也可以不再住在過去。',grad:'linear-gradient(135deg,#dbe6ee,#efdfc5)'},
{file:'10怎樣道歉才有效.m4a',cat:'關係修復',icon:'💬',title:'道歉怎麼說，才真的有效？',sub:'不是把「對不起」說完，而是讓對方感受到你真的看見了。',tags:['道歉','溝通','修復關係'],intro:'一句道歉，有時讓人更靠近，有時卻讓人更生氣。差別往往不只在「有沒有說對不起」，而是有沒有理解造成的影響，以及接下來願意怎麼做。',quote:'好的道歉，不是結束話題，而是開始負責。',think:'如果拿掉「可是」，你的道歉還剩下什麼？',action:'把想說的道歉寫成三句：我做了什麼、造成什麼影響、我接下來會怎麼做。',line:'被理解的傷，才有機會開始修復。',grad:'linear-gradient(135deg,#e6e0d6,#dce8e4)'},

const list=document.getElementById('episodeList'),audio=document.getElementById('audio'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),speedBtn=document.getElementById('speedBtn'),statusEl=document.getElementById('audioStatus');
let current=0,speeds=[1,1.25,1.5,2],speedIndex=0;
function fmt(sec){if(!Number.isFinite(sec))return'--:--';sec=Math.max(0,Math.floor(sec));return`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function renderList(){list.innerHTML='';topics.forEach((t,i)=>{const row=document.createElement('div');row.className='ep-row'+(i===current?' active':'');row.innerHTML=`<div class="thumb" style="background:${t.grad}">${t.icon}</div><div class="ep-meta"><div class="ep-kicker">${t.cat}</div><div class="ep-title">${t.title}</div></div><button class="playmini" aria-label="播放 ${t.title}">▶</button>`;row.addEventListener('click',()=>select(i,false));row.querySelector('.playmini').addEventListener('click',e=>{e.stopPropagation();select(i,true)});list.appendChild(row)})}
function select(i,autoplay=false){current=i;const t=topics[i];document.getElementById('dCat').textContent=t.cat;document.getElementById('dTitle').textContent=t.title;document.getElementById('dSubtitle').textContent=t.sub;document.getElementById('dTags').innerHTML=t.tags.map(x=>`<span class="tag">${x}</span>`).join('');document.getElementById('dIntro').textContent=t.intro;document.getElementById('dQuote').textContent=t.quote;document.getElementById('dThink').textContent=t.think;document.getElementById('dAction').textContent=t.action;document.getElementById('dLine').textContent=t.line;const cover=document.getElementById('coverBtn');cover.textContent=t.icon;cover.style.background=t.grad;audio.src='/light-audio/'+encodeURIComponent(t.file);audio.load();seek.value=0;document.getElementById('currentTime').textContent='0:00';document.getElementById('duration').textContent='--:--';playBtn.textContent='▶';statusEl.className='status';statusEl.textContent='正在讀取音檔…';document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===topics.length-1;renderList();if(autoplay)audio.play().catch(()=>{});}
function togglePlay(){if(audio.paused)audio.play().catch(()=>{});else audio.pause()}
playBtn.onclick=togglePlay;document.getElementById('coverBtn').onclick=togglePlay;document.getElementById('prevBtn').onclick=()=>current>0&&select(current-1,false);document.getElementById('nextBtn').onclick=()=>current<topics.length-1&&select(current+1,false);
audio.addEventListener('loadedmetadata',()=>{document.getElementById('duration').textContent=fmt(audio.duration);statusEl.className='status';statusEl.textContent='音檔已就緒'});audio.addEventListener('play',()=>playBtn.textContent='❚❚');audio.addEventListener('pause',()=>playBtn.textContent='▶');audio.addEventListener('ended',()=>playBtn.textContent='▶');audio.addEventListener('timeupdate',()=>{document.getElementById('currentTime').textContent=fmt(audio.currentTime);if(audio.duration)seek.value=Math.round(audio.currentTime/audio.duration*1000)});audio.addEventListener('error',()=>{statusEl.className='status error';statusEl.textContent='音檔暫時無法讀取，請稍後重試。'});seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=audio.duration*(Number(seek.value)/1000)});speedBtn.onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;audio.playbackRate=speeds[speedIndex];speedBtn.textContent=speeds[speedIndex]+'×'};
renderList();select(0,false);
</script>
</body>
