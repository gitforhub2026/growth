<section class="hero"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">LIGHT HOUSE · PODCAST</div><h1>傳愛<br>光明棧</h1><p>在生活的轉彎處，陪你看見一點光。</p><div class="sub">給正在努力生活的你，一段可以慢慢聽的陪伴。</div></div><div class="hero-art"><img src="assets/hero.webp" alt="陽光下的孩子與花朵"><div class="doodle">一段聲音的陪伴，<br>給正在努力生活的你。</div></div></div></section>
<section><div class="section-head"><h2>選一集，慢慢聽</h2><p>選一個此刻最靠近你的題目，讓這段陪伴陪你走一會兒。</p></div><div class="content"><button class="mobile-picker" id="mobilePicker" type="button" aria-expanded="false"><span><b>選擇其他集數</b><small>找到此刻想聽的一集</small></span><span class="picker-arrow">⌄</span></button><aside class="episode-list" id="episodeList"></aside><article class="detail" id="detail"><div class="detail-top"><button class="navbtn" id="prevBtn">← 上一集</button><button class="navbtn" id="nextBtn">下一集 →</button></div><div class="detail-hero"><button class="cover" id="coverBtn" aria-label="播放本集"></button><div><div class="topic-label">PODCAST</div><h3 id="dTitle"></h3><div class="subtitle" id="dSubtitle"></div><div class="tags" id="dTags"></div></div></div><audio id="audio" preload="metadata"></audio><div class="player"><button class="play" id="playBtn" aria-label="播放">▶</button><div class="progress-wrap"><input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="播放進度"><div class="time"><span id="currentTime">0:00</span> / <span id="duration">--:--</span></div></div><button class="speed" id="speedBtn">1×</button></div><div class="status" id="audioStatus"></div><div class="quick"><section class="panel"><h4>▤　本集簡介</h4><p id="dIntro"></p></section><aside class="panel soft" id="dQuote"></aside></div><section class="panel takeaways"><h4>💡　這一集，你會帶走</h4><ul id="dTakeaways"></ul></section><div class="microgrid"><section class="micro"><h5>💬 想一想</h5><p id="dThink"></p></section><section class="micro"><h5>🌱 今天的小行動</h5><p id="dAction"></p></section><section class="micro"><h5>♡ 留給自己的一句話</h5><p id="dLine"></p></section></div><div class="mobile-bottom-nav"><div class="continue-label">繼續聽</div><div class="bottom-nav-row"><button class="navbtn" id="prevBtnBottom">← 上一集</button><button class="navbtn" id="nextBtnBottom">下一集 →</button></div><button class="all-episodes-btn" id="mobileBottomPicker" type="button">查看全部集數</button></div></article></div></section>

<script>
const topics=[
{icon:'🧠',file:'01 (1).m4a',title:'有些事情，為什麼一直放不下？',sub:'當大腦深陷重播模式，理解反芻機制的運作，才能溫柔地把今天還給自己。',intro:'深夜反覆回想過去的一句話或決定，並非因為你脆弱，而是大腦在試圖釐清危機。節目拆解大腦卡住的反芻機制與白熊效應，帶你區分「被動受困」與「主動接受」的差異。放下不是強迫記憶消失，而是讓事件不再引發劇烈的情緒波瀾。',take:['看清大腦反覆重播的生理保護機制，不再將停留在過去歸咎於個人脆弱。','釐清「算了」的無奈妥協與「接受」的內在轉折，重新定義放下的真正意涵。','掌握停止無效思考的轉移技巧，避免陷入越想壓抑越難以忘懷的認知循環。'],think:'那件讓你掛念許久的事情，今天還需要你立刻做什麼嗎？如果沒有，你願不願意先把它放下？',action:'設定 5 分鐘鬧鐘，將腦中反覆出現的煩惱寫在紙上，隨後闔上紙張並告訴自己：「今天就思考到這裡。」',line:'真正的放下不是強迫大腦忘記過去，而是當記憶再次浮現時，內心不再被驚擾。',tags:['反芻思考','白熊效應','接受與算了','認知轉移','大腦機制']},
{icon:'🤝',file:'02 (1).m4a',title:'不是每段關係，都要回到原來的樣子',sub:'經歷衝突與變故後，修復並不等於復原，而是重新找到彼此舒服的新距離。',intro:'許多人以為關係出了裂痕，就必須努力修補回最初的親密狀態，這種執念反而帶來二次傷害。本集探討關係修復的本質，說明「和好」與「找到新定位」的界線。不論是家人、伴侶或朋友，停止強求回到過去，才能為彼此打造維持尊重與自由的互動距離。',take:['明白關係修復不代表無條件和好，而是找到雙方都能安心相處的新位置。','釐清原諒、和解與信任的層次差異，不再因為無法重返過去而感到自責。','掌握設定互動邊界的方法，在保留連結的同時，也維護個人的內在空間。'],think:'這段讓你感到疲憊的關係，現在需要的究竟是更靠近，還是一個更健康的新距離？',action:'思考一段卡住的關係，寫下 1 個你一直勉強自己配合、但其實需要適度調整的互動習慣。',line:'關係不需要強求還原成最初的模樣，找到彼此都能自在呼吸的距離就是圓滿。',tags:['關係修復','心理距離','課題分離','互動邊界','和解與原諒']},
{icon:'🪡',file:'03修復不等於和好.m4a',title:'修復不等於和好：給受傷關係的新定位',sub:'剖析關係破裂後的修復機制，讓每次爭執與摩擦成為理解彼此的全新起點。',intro:'當衝突發生時，我們常急著消除情緒或分出對錯，卻忽略了「破裂與修復」是關係常態。本集引導聽眾看待裂痕背後的心理需求，學習如何在傷害發生後進行有意義的溝通。即使關係無法重拾舊觀，修復過程也能幫助我們整理內心，不再帶著怨恨繼續生活。',take:['理解關係破裂是互動中的必然過程，關鍵在於雙方是否有意願開啟修復。','分辨防衛性回應與真誠表達的差別，減少溝通時彼此互丟情緒炸彈的消耗。','建立對關係結局的彈性認知，學會在保留彼此尊嚴的前提下重新定位連結。'],think:'在最近一次與重要他人的爭執中，你當時最渴望對方聽懂的內在需求是什麼？',action:'傳一則簡短訊息給一位近期有輕微摩擦的朋友，表達關心但不急於爭論先前的話題。',line:'關係中的裂痕不是失敗的證明，而是提醒我們重新檢視彼此需求的真實契機。',tags:['破裂與修復','溝通機制','情緒需求','關係重構','真誠連結']},
{icon:'🌙',file:'04 (1).m4a',title:'一個人的時候，怎麼和孤單相處？',sub:'翻轉對獨處的負面刻板印象，將不安的孤獨轉化為沉澱自我與深呼吸的空間。',intro:'置身熱鬧人群卻感到疏離，或是獨自一人時湧現不安？節目透過心理學視角，區分「孤單的匱乏感」與「獨處的沉澱感」。孤單並非病態，而是內在渴望連結的訊號。透過重新評價孤獨的價值，你能在寂靜時刻找回與自己的真實對話，不再隨意尋求無效社交。',take:['區分被動孤單與主動獨處的心理機制，不再將單身或獨處等同於社交失敗。','運用認知重評技巧，將突如其來的不安感轉化為梳理情緒的沉澱契機。','建立品質優先的社交觀念，擺對重心以降低因為無效連結產生的內耗感。'],think:'當你感到孤單時，你真正渴望的是他人的陪伴，還是希望自己的感受被看見？',action:'關掉手機與電視 10 分鐘，單純坐在椅子上享受一杯溫水，感受完全屬於自己的平靜。',line:'獨處是與自己對話的寶貴時刻，當你不再害怕安靜，孤單就失去了威脅力。',tags:['孤單與獨處','認知重評','內在連結','社交品質','心理沉澱']},
{icon:'🧭',file:'05撕下社會名牌找回自己.m4a',title:'重新找工作，也重新找回自己',sub:'告別名牌與職稱的約束，在職涯轉折處重新釐清自我價值與生活的核心。',intro:'失去工作或面臨轉職時，最讓人恐慌的往往不是求職過程，而是「沒有職稱後我是誰」的迷惘。本集聚焦於職涯轉折期，探討如何將個人價值與職業頭銜解綁。透過盤點核心能力與生活需求，陪你在尋找新跑道的同時，建立不被外在職務動搖的內在安定感。',take:['看清職業頭銜與自我認同的過度連結，擺脫失去名牌後產生的焦慮恐慌。','掌握轉職期心理調適方法，區分「建立新生活」與「純粹找工作」的差異。','透過實際能力盤點，找出不受環境變遷影響的可轉移優勢與個人特質。'],think:'如果完全不考慮別人的眼光與頭銜好壞，你最希望在工作中獲得什麼樣的體驗？',action:'拿出一張紙，寫下 3 個與職業、薪水無關，但能展現你個人能力或優點的事情細節。',line:'你的價值來自於你這個人的本質與行動，從不取決於名片上印著什麼職稱。',tags:['職涯轉折','自我認同','頭銜解綁','能力盤點','內在安定']},
{icon:'🏷️',file:'06 (1).m4a',title:'當別人只記得你做錯的事',sub:'面對大眾標籤與過往過錯，學會承擔該負的責任，同時卸下不屬於你的枷鎖。',intro:'做對百次無人提及，做錯一次卻被銘記多年？節目深入剖析心理學中的「標籤效應」與負面偏誤，探討過往錯誤為何難以消逝。你不需盲目忽視他人的眼光，而是要看清哪些是必須承擔的責任，哪些是不必背負一生的刻板印象，進而在標籤之外重建真實人生。',take:['理解社會標籤效應的形成心理，不再讓過去單一事件定義你的整個人生。','劃分責任的合理界線，清楚區隔「應承擔的後果」與「無效的社會烙印」。','掌握重建信心的實際步調，透過持續的日常行動逐漸改寫他人的刻板印象。'],think:'你是否也正背負著某個多年前的負面標籤？那個標籤真的代表現在的你嗎？',action:'在心中或紙上記錄下那個困擾你的標籤，隨後寫下 1 件你近期做過、能反駁該標籤的事實。',line:'過去的錯誤是你經歷過的事實，但絕不等於你這個人的全部價值與未來。',tags:['標籤效應','負面偏誤','責任界線','印象重構','自我定義']},
{icon:'🧹',file:'07靠微勝利走出低潮.m4a',title:'生活亂掉了，就從一件小事開始',sub:'當生活深陷混亂與失控，拋開龐大計畫，透過極小行動重新取得掌控感。',intro:'房間混亂、作息失序、待辦事項堆積如山，越想徹底整頓就越感到無力。本集介紹心理學的「微勝利」概念，說明為什麼混亂時刻不需要宏大的改革計畫。從洗一個杯子、整理一張床開始，微小的日常秩序能為大腦帶來最直接的掌控感與安定力量。',take:['明白混亂時制定大目標容易導致規劃謬誤，轉而專注於極小規模的微勝利。','體驗完成微小行動所帶來的即時心理回饋，快速打破無力與拖延的惡性循環。','建立簡單的日常恢復儀式，在失控的生活中為自己保留一塊可控的避風港。'],think:'看一看你身邊的環境，有沒有哪一件可以在兩分鐘內完成的小事，能讓你感覺順眼一點？',action:'立刻去把桌上清空一小角，或是花 3 分鐘把今天穿過的鞋子整齊擺好在鞋架上。',line:'重整生活不需要一次到位，每一個微小的行動都是你奪回掌控感的真摯證明。',tags:['微勝利','日常秩序','掌控感','規劃謬誤','習慣建立']},
{icon:'🏠',file:'08為什麼改變了還是不被信任.m4a',title:'當家人還不相信我的改變',sub:'理解改變與信任恢復之間的時間差，用持續一致的行動代替焦慮的口頭辯解。',intro:'明明自己已經徹底改變，家人卻依然用舊眼光防備或質疑，這種挫折感常讓人想放棄。本集探討信任毀壞後的修復機制，說明「個體改變」與「關係信任」不同步的客觀事實。節目將陪伴你理解家人的焦慮與害怕，學習少說誓言、多做小事，給予信任時間慢慢沉澱。',take:['接納信任修復存在的時間落差，理解家人的懷疑往往源於過去受傷的防衛。','停止用過度辯解來證明自己，轉而專注於長期一致且可預期的實際行為。','建立穩定的心理抗壓韌性，明白自己的改變本來就不需要完全仰賴他人認可。'],think:'當家人再度提起過去的錯誤時，你能不能看見那份質疑背後，其實隱藏著他們的害怕？',action:'今天不對家人做任何承諾，只需安靜且順手完成 1 件家務，並維持平穩溫和的語氣。',line:'信任的重建需要時間沉澱，用持續平穩的行動說明一切，時間會為你給出答案。',tags:['信任修復','行為一致性','時間落差','家庭互動','心理韌性']},
{icon:'🌱',file:'09別讓過去定義你.m4a',title:'我可以不再是以前的自己',sub:'善用大腦的神經可塑性，透過微小習慣的累積，一步步重構全新的身分認同。',intro:'「你以前就是這樣，怎麼可能改？」這句話是否曾打擊你的信心？本集結合大腦科學的神經可塑性與行為心理學，打破「性格終身固定」的迷思。節目將帶你了解，過去的經驗只是塑造現在的原料，而非未來的限制。只要改變微小的每日選擇，就能逐漸證明自己的轉變。',take:['了解大腦具備持續塑造的神經可塑性，相信自我改變具有科學基礎。','掌握基於「身分認同」的習慣建立法，將「想變好」轉化為「我是這樣的人」。','學會在日常小事中尋找改變的證據，逐漸替換掉過去負面且限制性的舊信念。'],think:'最近的日常生活中，有沒有哪一個微小的選擇，已經證明你不再是過去的那個你了？',action:'做一個符合你理想身分的小選擇，例如選擇喝一杯白開水，並在心裡肯定這個決定。',line:'過去的經歷組成了你的歷史，但每一個當下的選擇，都在重新定義你是誰。',tags:['神經可塑性','身分認同','習慣養成','限制性信念','自我重構']},
{icon:'💬',file:'10怎樣道歉才有效.m4a',title:'有些對不起，還來得及說嗎？',sub:'拆解真誠道歉的核心要素，明白道歉是為了承擔責任，而非勒索對方的原諒。',intro:'一句埋藏多年的對不起，時間越久越難開口。本集探討道歉的真正心理意涵，說明有效道歉的核心在於「承擔責任與同理傷害」，而非急於減輕自身的愧疚。節目將引導你思考道歉的初衷，即使對方選擇不原諒，真誠的表達與後續行動也能為你帶來內在的平靜。',take:['掌握有效道歉的關鍵結構，明白表達歉意必須建立在坦承責任與同理痛苦上。','放下對「必須獲得原諒」的期待，理解道歉是個人的選擇，原諒則是對方的權利。','體會真正的道歉不只是一句對不起，更需要後續長期行動，用負責任的態度回應過錯。'],think:'你心中是否也有一句藏了許久的對不起？你希望表達這份歉意，是為了對方還是自己？',action:'準備一張紙，寫下那句你一直沒開口的道歉內容，試著釐清自己真正想承擔的責任。',line:'真誠的道歉是為了對過錯展現責任，至於原諒與否，請尊重對方的選擇與時間。',tags:['有效道歉','承擔責任','同理傷害','信任修復','內在平靜']},
{icon:'👣',file:'11靠微小行動走出低潮.m4a',title:'重新開始，第一步不用很大',sub:'運用行為活化技巧，打破「等有動力才行動」的迷思，靠極小步驟重啟生活。',intro:'想改變卻列了一大堆完美計畫，最後因為壓力過大而放棄？本集介紹臨床心理學的「行為活化」與微習慣公式。行動能創造動力，而非等待動力帶來行動。透過設計 5 分鐘內就能完成的微小步驟，你能在不耗費大量意志力的情況下踏出第一步。',take:['打破「先有動力才有行動」的迷思，理解行動本身可以帶來正向回饋。','學會將龐大目標拆解至 5 分鐘內可完成的微小行動，有效降低開始的心理阻力。','運用「提示－能力－動機」的行為公式，讓好的微小習慣更容易融入日常生活。'],think:'如果完全不考慮未來的成果，現在有沒有一件只需 3 分鐘就能做完的小事？',action:'挑選一件你拖延許久的事，只花 3 分鐘做其中最簡單的一小部分，時間一到立刻停止。',line:'重新開始不需要驚天動地的誓言，踏出微小到不會失敗的第一步就足夠強大。',tags:['行為活化','微習慣','行動創造動力','心理阻力','習慣公式']},
{icon:'🛤️',file:'12劃出人生停損點.m4a',title:'如果人生走錯了一段路',sub:'理性評估沉沒成本與停損點，理解轉變期的混亂，把過去的經歷化為未來資糧。',intro:'發現自己花了好幾年走的不是理想的路，該堅持還是停損？本集結合人生轉變期理論，拆解告別、混亂中期與新開始三階段。走錯路不代表時間白費，痛苦的混亂期是生命重構的砌磚過程。節目帶你建立冷靜的評估指標，勇敢為不適合的路劃下停損點。',take:['釐清沉沒成本對決策的干擾，掌握評估「堅持」與「適時停損」的兩個關鍵指標。','認識人生轉變期的心理三階段，接納混亂中期產生的迷惘與不安是重構的必然。','學習將過去看似走錯的經驗重新整合，轉化為下一階段人生發展的獨特資糧。'],think:'如果不需向任何人證明以前的選擇是對的，你現在會做出什麼樣的新決定？',action:'盤點一項讓你感到消耗的安排，寫下停損這件事會帶來的風險，以及能釋放出的資源。',line:'人生沒有白走的路，適時停損不是承認失敗，而是把時間與精力還給正確的方向。',tags:['人生停損','轉變期','沉沒成本','混亂中期','經驗整合']},
{icon:'🕊️',file:'13.m4a',title:'原諒，真的是唯一的出口嗎？',sub:'理解寬恕的心理原則，明白寬恕是為了放過自己，而非替傷害你的人尋找藉口。',intro:'當受傷時，旁人常勸「你要學會原諒」，這反而帶來沉重壓力。本集從寬恕研究出發，打破對原諒的迷思。寬恕不等於忘記過錯或與傷害者和解，而是奪回被過往傷痛控制的主導權。即使不原諒對方，也能練習把注意力帶回自己的生活與平靜。',take:['翻轉對原諒的傳統誤解，明白寬恕可以是切斷傷痛對當前生活的持續宰制。','把專注力從「傷害者」轉回「自身生活」，不再讓過去持續佔據今天。','練習關懷受傷的自己，不再因為無法輕易原諒他人而對自己產生無謂的自責。'],think:'那段讓你耿耿於懷的過往，是否正悄悄消耗著你今天原本可以享受的快樂？',action:'在紙上寫下：「我可能還無法原諒這件事，但我選擇今天不再用它來懲罰我自己。」',line:'寬恕不是替傷害找藉口，而是選擇把平靜與自由還給現在的自己。',tags:['寬恕','自我寬恕','放過自己','傷痛切斷','內在平靜']},
{icon:'🚪',file:'14.m4a',title:'面對原生家庭，如何不斷聯也不委屈？',sub:'在愛與愧疚之間建立心理界線，練習中性回應，打造有溫度也有自由的新距離。',intro:'與原生家庭相處，最難的往往不是缺乏愛，而是愛裡混雜了責任、愧疚與期待。本集探討如何劃定情緒、時間與責任界線。界線不是拒絕關係的牆，而是一扇可開合的門。透過練習中性回應與三步覺察，你能在不選擇斷聯的前提下，維護自己的獨立與尊嚴。',take:['掌握情緒、時間與責任的三層界線劃分，避免持續被捲入家人的情緒風暴中。','學會運用中性回應代替防衛或討好，降低家庭互動後產生的心理消耗與疲憊。','理解課題分離的心理智慧，明白愛家人與照顧自己的內在需求可以同時並存。'],think:'在與家人的互動中，有哪些責任其實是屬於他們的課題，但你卻習慣攬在自己身上？',action:'下次家人傳來帶有情緒壓力的訊息時，先暫停 10 分鐘不回覆，給自己一個冷卻期。',line:'建立界線不是拒絕愛，而是清楚知道到哪裡為止是我，讓關係在健康距離中延續。',tags:['原生家庭','心理界線','課題分離','中性回應','關係疲勞']},
{icon:'🌬️',file:'15.m4a',title:'突然焦慮卡住時，如何把自己接回當下？',sub:'運用身心接地技巧與一次一事原則，在失控的焦慮風暴中快速找回內在安定。',intro:'面對未知與不確定性，大腦容易陷入災難化思考，引發強烈的焦慮與失控感。本集介紹實用的身心調節工具「54321 接地法」與「一次一事」正念練習。當思緒紛亂時，學會透過五感連結當下環境，安頓身體，在混亂中重新找回專注與平靜。',take:['理解焦慮引發的身體與思緒失控機制，不再因為突然的情緒湧現而感到恐慌。','熟練運用 54321 接地技巧，透過五感體驗快速將注意力拉回當下的物理環境。','建立「一次只做一件事」的專注習慣，有效降低因為多工與過度思考帶來的耗損。'],think:'當焦慮浮現時，你的身體哪裡最先感到緊繃？你願意停下來給那個部位一次深呼吸嗎？',action:'開啟 54321 練習：看 5 個物品、摸 4 個材質、聽 3 個聲音、聞 2 個氣味、嚐 1 個味道。',line:'焦慮只是一陣過境的風暴，透過感受當下的呼吸與身邊環境，你隨時能找回平靜。',tags:['焦慮調適','54321接地法','一次一事','當下專注','身心調節']}
];
const list=document.getElementById('episodeList'),audio=document.getElementById('audio'),playBtn=document.getElementById('playBtn'),coverBtn=document.getElementById('coverBtn'),seek=document.getElementById('seek'),speedBtn=document.getElementById('speedBtn'),audioStatus=document.getElementById('audioStatus'),mobilePicker=document.getElementById('mobilePicker'),mobileBottomPicker=document.getElementById('mobileBottomPicker'),prevBtnBottom=document.getElementById('prevBtnBottom'),nextBtnBottom=document.getElementById('nextBtnBottom');let current=0,speedIndex=0;const speeds=[1,1.25,1.5,2];
function fmt(s){if(!Number.isFinite(s))return'--:--';s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderList(){list.innerHTML='';topics.forEach((t,i)=>{const row=document.createElement('div');row.className='ep-row'+(i===current?' active':'');row.innerHTML=`<div class="thumb">${t.icon}</div><div class="ep-meta"><div class="ep-kicker">PODCAST</div><div class="ep-title">${t.title}</div></div><button class="playmini" aria-label="直接播放">▶</button>`;row.onclick=()=>selectTopic(i,true);row.querySelector('.playmini').onclick=(ev)=>{ev.stopPropagation();playTopic(i)};list.appendChild(row)})}
function closeMobileList(){if(window.innerWidth<=680){list.classList.remove('mobile-open');mobilePicker.classList.remove('open');mobilePicker.setAttribute('aria-expanded','false')}}
function selectTopic(i,scroll=false){current=i;const t=topics[i];audio.pause();audio.currentTime=0;playBtn.textContent='▶';coverBtn.textContent=t.icon;document.getElementById('dTitle').textContent=t.title;document.getElementById('dSubtitle').textContent=t.sub;document.getElementById('dTags').innerHTML=t.tags.map(x=>`<span class="tag">${x}</span>`).join('');document.getElementById('dIntro').textContent=t.intro;document.getElementById('dQuote').textContent=t.line;document.getElementById('dTakeaways').innerHTML=t.take.map(x=>`<li>${x}</li>`).join('');document.getElementById('dThink').textContent=t.think;document.getElementById('dAction').textContent=t.action;document.getElementById('dLine').textContent=t.line;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===topics.length-1;prevBtnBottom.disabled=i===0;nextBtnBottom.disabled=i===topics.length-1;seek.value=0;document.getElementById('currentTime').textContent='0:00';document.getElementById('duration').textContent='--:--';audio.src='/light-audio/'+encodeURIComponent(t.file);audioStatus.textContent='';audioStatus.className='status';renderList();closeMobileList();if(scroll&&window.innerWidth<981)document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function playTopic(i){if(current===i&&!audio.paused){audio.pause();return}selectTopic(i,false);audio.play().catch(()=>{audioStatus.textContent='暫時無法播放，請稍後再試。';audioStatus.className='status show'})}
function toggle(){if(audio.paused){audio.play().catch(()=>{audioStatus.textContent='暫時無法播放，請稍後再試。';audioStatus.className='status show'})}else audio.pause()}
function toggleMobileEpisodes(){const open=list.classList.toggle('mobile-open');mobilePicker.classList.toggle('open',open);mobilePicker.setAttribute('aria-expanded',String(open))}
playBtn.onclick=toggle;coverBtn.onclick=toggle;audio.onplay=()=>{playBtn.textContent='❚❚';audioStatus.textContent='';audioStatus.className='status';renderList()};audio.onpause=()=>{playBtn.textContent='▶';renderList()};audio.onloadedmetadata=()=>document.getElementById('duration').textContent=fmt(audio.duration);audio.ontimeupdate=()=>{if(audio.duration){seek.value=Math.round(audio.currentTime/audio.duration*1000);document.getElementById('currentTime').textContent=fmt(audio.currentTime)}};seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};speedBtn.onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;audio.playbackRate=speeds[speedIndex];speedBtn.textContent=speeds[speedIndex]+'×'};document.getElementById('prevBtn').onclick=()=>current>0&&selectTopic(current-1,true);document.getElementById('nextBtn').onclick=()=>current<topics.length-1&&selectTopic(current+1,true);prevBtnBottom.onclick=()=>current>0&&selectTopic(current-1,true);nextBtnBottom.onclick=()=>current<topics.length-1&&selectTopic(current+1,true);mobilePicker.onclick=toggleMobileEpisodes;mobileBottomPicker.onclick=()=>{list.classList.add('mobile-open');mobilePicker.classList.add('open');mobilePicker.setAttribute('aria-expanded','true');mobilePicker.scrollIntoView({behavior:'smooth',block:'center'})};selectTopic(0);
</script>
